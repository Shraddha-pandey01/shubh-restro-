<style>
        body {
            background-color: #0A0A0A;
        }
        
        .glass-panel {
            background: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .input-ghost {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 0;
            color: #e5e2e1;
            padding: 12px 0;
            transition: all 0.3s ease;
        }

        .input-ghost:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 1px solid #d4af37;
        }

        .input-ghost::placeholder {
            color: transparent;
        }

        .floating-label-group {
            position: relative;
            margin-bottom: 32px;
        }

        .floating-label {
            position: absolute;
            left: 0;
            top: 12px;
            pointer-events: none;
            transition: 0.2s ease all;
            color: rgba(208, 197, 175, 0.7);
        }

        .input-ghost:focus ~ .floating-label,
        .input-ghost:not(:placeholder-shown) ~ .floating-label {
            top: -12px;
            font-size: 10px;
            color: #d4af37;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Custom Scrollbar for summary if needed */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.6);

<body class="text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/30 selection:text-primary">
<!-- Top Navigation Omitted for Checkout context -->
<main class="flex-grow pt-margin-desktop md:pt-32 pb-section-gap px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto w-full">
<div class="mb-16 md:mb-24">
<a class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-caps text-label-caps group" href="#">
<span class="material-symbols-outlined transform group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                Return to Menu
            </a>
<h1 class="font-headline-lg text-headline-lg mt-8">Secure Checkout</h1>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-gutter items-start">
<!-- Left Column: Forms -->
<div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-16">
<!-- Contact Information -->

<h2 class="font-headline-md text-headline-md mb-8 flex items-center gap-4">
<span class="text-primary/50 text-sm font-label-caps">01</span>
                        Contact Details
                    </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
<div class="floating-label-group md:col-span-2">
<input class="input-ghost w-full font-body-md" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label font-label-caps" for="email">Email Address</label>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full font-body-md" id="firstName" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="firstName">First Name</label>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full font-body-md" id="lastName" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="lastName">Last Name</label>
</div>
<div class="floating-label-group md:col-span-2">
<input class="input-ghost w-full font-body-md" id="phone" placeholder=" " type="tel"/>
<label class="floating-label font-label-caps" for="phone">Phone Number (Optional)</label>
</div>
</div>
</section>
<!-- Shipping Information -->
<section>
<h2 class="font-headline-md text-headline-md mb-8 flex items-center gap-4">
<span class="text-primary/50 text-sm font-label-caps">02</span>
                        Delivery Address

<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
<div class="floating-label-group md:col-span-2">
<input class="input-ghost w-full font-body-md" id="address" placeholder=" " required="" type="text"/>

</div>
<div class="floating-label-group md:col-span-2">
<input class="input-ghost w-full font-body-md" id="apartment" placeholder=" " type="text"/>
<label class="floating-label font-label-caps" for="apartment">Apartment, suite, etc. (optional)</label>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full font-body-md" id="city" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="city">City</label>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full font-body-md" id="postal" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="postal">Postal Code</label>
</div>
</div>
</section>

<span class="text-primary/50 text-sm font-label-caps">03</span>
                        Payment Method

<div class="glass-panel p-8 rounded-none mb-8">
<div class="flex gap-4 mb-8 border-b border-primary/20 pb-4">
<label class="flex items-center gap-2 cursor-pointer text-on-surface">
<input checked="" class="text-primary focus:ring-primary/50 bg-transparent border-primary/50" name="payment" type="radio"/>
<span class="font-label-caps text-label-caps">Credit Card</span>
</label>
<label class="flex items-center gap-2 cursor-pointer text-on-surface-variant">
<input class="text-primary focus:ring-primary/50 bg-transparent border-primary/50" name="payment" type="radio"/>
<span class="font-label-caps text-label-caps">Digital Wallet</span>
</label>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8">
<div class="floating-label-group md:col-span-2">
<input class="input-ghost w-full font-body-md" id="cardName" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="cardName">Name on Card</label>
</div>
<div class="floating-label-group md:col-span-2 relative">
<input class="input-ghost w-full font-body-md pr-12" id="cardNumber" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="cardNumber">Card Number</label>
<span class="material-symbols-outlined absolute right-0 top-3 text-on-surface-variant" data-icon="credit_card">credit_card</span>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full font-body-md" id="expiry" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="expiry">Expiration (MM/YY)</label>
</div>
<div class="floating-label-group relative">
<input class="input-ghost w-full font-body-md pr-8" id="cvc" placeholder=" " required="" type="text"/>
<label class="floating-label font-label-caps" for="cvc">Security Code</label>
<span class="material-symbols-outlined absolute right-0 top-3 text-on-surface-variant text-sm cursor-help" data-icon="help" title="3 digits on back of card">help</span>

</div>
</div>

</div>
</div>
<span class="font-body-md text-primary">$450.00</span>
</div>
<!-- Item 2 -->
<div class="flex justify-between items-start gap-4">
<div class="flex gap-4">
<div class="w-16 h-16 bg-surface-container-high border border-primary/20 relative overflow-hidden shrink-0">
<img class="object-cover w-full h-full opacity-80 mix-blend-luminosity hover:mix-blend-normal transition-all duration-500" data-alt="A moody, high-end photograph of a crystal decanter and two elegant wine glasses filled with deep red wine. The setting is dimly lit, with a dramatic spotlight catching the faceted glass and rich burgundy color of the liquid, resting on a polished dark wood table in an exclusive dining room." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZNJkyxByJfQmlSoIsZUozCxOQZ-POxmJYJVkRQFowActLhiq7a__oTK3jJAeYt23wxCJ14Cp3R8l_pD0f6f0uqNVc5Z3t9KPzcu1Lxo0WM-1uX3L6nk0TbOcL3phTqqVV1D_6n-sk_TZdIORozz6i9HDLF9PWWrdKomcEo5QMD-oU-cMK2GWObpgqpZgWsKQu5hIvRBpw9rQlY0mPCKnDd0CQTotxuDYL7tOzZ5netpNl4mqgK0R4"/>
</div>
<div>
<h4 class="font-body-md text-on-surface font-semibold">Sommelier Pairing</h4>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">Qty: 2</p>

</div>
<span class="font-body-md text-primary">$300.00</span>
</div>
</div>
<div class="flex flex-col gap-4 font-body-md text-on-surface-variant mb-8 border-b border-primary/20 pb-8">
<div class="flex justify-between">
<span>Subtotal</span>
<span>$750.00</span>
</div>
<div class="flex justify-between">
<span>Taxes</span>
<span>$67.50</span>
</div>
<div class="flex justify-between">
<span>Service Charge (20%)</span>
<span>$150.00</span>
</div>
</div>
<div class="flex justify-between items-end mb-12">
<span class="font-headline-md text-headline-md text-on-surface">Total</span>
<span class="font-headline-md text-headline-md text-primary">$967.50</span>
</div>
<button class="w-full bg-primary hover:bg-[#ffe088] text-[#131313] font-label-caps text-label-caps py-6 px-8 transition-colors duration-300 flex justify-center items-center gap-2 group">
                        Complete Reservation

</button>
<p class="text-center text-on-surface-variant/50 text-[10px] mt-4 font-label-caps tracking-widest">
