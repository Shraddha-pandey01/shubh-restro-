<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumière Noir - Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#c8c6c5",
                        "inverse-surface": "#e5e2e1",
                        "on-primary-container": "#554300",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#e9c349",
                        "surface-tint": "#e9c349",
                        "outline-variant": "#4d4635",
                        "on-surface": "#e5e2e1",
                        "on-primary": "#3c2f00",
                        "tertiary": "#d0cdcd",
                        "on-secondary-fixed": "#1a1c19",
                        "primary": "#f2ca50",
                        "on-secondary-fixed-variant": "#454744",
                        "primary-fixed": "#ffe088",
                        "primary-container": "#d4af37",
                        "surface-dim": "#131313",
                        "surface-bright": "#3a3939",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-container": "#454544",
                        "surface-variant": "#353534",
                        "surface-container-highest": "#353534",
                        "on-primary-fixed-variant": "#574500",
                        "on-secondary": "#2f312e",
                        "on-secondary-container": "#b8b9b4",
                        "on-background": "#e5e2e1",
                        "outline": "#99907c",
                        "on-error": "#690005",
                        "on-surface-variant": "#d0c5af",
                        "inverse-on-surface": "#313030",
                        "secondary-fixed-dim": "#c6c7c2",
                        "on-error-container": "#ffdad6",
                        "surface": "#131313",
                        "inverse-primary": "#735c00",
                        "background": "#131313",
                        "secondary-fixed": "#e3e3de",
                        "on-primary-fixed": "#241a00",
                        "on-tertiary-fixed-variant": "#474746",
                        "secondary": "#c6c7c2",
                        "tertiary-container": "#b4b2b2",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#1c1b1b",
                        "tertiary-fixed": "#e5e2e1",
                        "secondary-container": "#484a46",
                        "on-tertiary": "#313030",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "80px",
                        "unit": "8px",
                        "margin-mobile": "24px",
                        "gutter": "24px",

                    },
                    "fontFamily": {
                        "body-lg": ["Montserrat"],
                        "headline-lg": ["Playfair Display"],

                        "display-lg-mobile": ["Playfair Display"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.8", "letterSpacing": "0.01em", "fontWeight": "300" }],
                        "headline-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.2em", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],

                        "display-lg-mobile": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: theme('colors.on-background');
        }
        .glass-panel {
            background-color: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .input-line {
            background: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.primary-container');
            color: theme('colors.on-surface');
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-line:focus {
            box-shadow: none;
            border-color: theme('colors.primary');
            outline: none;
        }
        /* Autofill dark mode fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1a1a1a inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Cinematic Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A cinematic, extremely dark and moody abstract architectural space. High-end luxury aesthetic echoing a Michelin-star restaurant at dusk. Shadows are deep charcoal black, with very subtle, out-of-focus golden light streaks reflecting off glass and polished marble surfaces. Minimalism and negative space dominate, creating a sense of secure exclusivity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDsox5RbYd9Ojz5AQKuA2d5UhUvInEy_of_tpSwwWRqYiKaJEGUhDex2QfZ1pFflLma15Hn-4eDv1fkO8xrNl51DQTXkUiE_HFQYGlaxf_bXMFEhBQrHh4IjZ6TB81BMvjZ20VrFv7avbJfmZPhRgmlOokme9ID573DcMoyXZnEhEa9R4kf5tU4KmBoLUGG0jDQ2womIwsDT8SQhMXJHxTmQCflTrGOrEem_Kg38tJEI-mQ0mecebD0')">
<div class="absolute inset-0 bg-background/80 mix-blend-multiply"></div>
</div>
<!-- Login Card -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-panel p-12 flex flex-col gap-10">
<header class="text-center">
<h1 class="font-headline-md text-headline-md text-primary tracking-widest uppercase">Lumière</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2">Management Console</p>
</header>
<form class="flex flex-col gap-8" onsubmit="event.preventDefault(); window.location.href='/dashboard';">
<div class="flex flex-col gap-2 relative">
<label class="font-label-caps text-label-caps text-on-surface-variant absolute -top-4 left-0 transition-all" for="admin-id">Admin ID</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/50" style="font-variation-settings: 'FILL' 0;">badge</span>
<input class="input-line w-full font-body-md text-body-md py-2" id="admin-id" name="admin-id" placeholder=" " required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2 relative mt-4">
<label class="font-label-caps text-label-caps text-on-surface-variant absolute -top-4 left-0 transition-all" for="password">Passcode</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/50" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-line w-full font-body-md text-body-md py-2" id="password" name="password" placeholder=" " required="" type="password"/>
<button aria-label="Toggle password visibility" class="text-primary/50 hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="form-checkbox bg-transparent border-primary/50 text-primary rounded-none focus:ring-primary focus:ring-offset-background group-hover:border-primary transition-colors" type="checkbox"/>
<span class="font-body-md text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-caps text-[10px] text-primary/70 hover:text-primary transition-colors" href="#">Recover Access</a>
</div>
<button class="mt-4 w-full bg-primary text-on-primary font-label-caps text-label-caps py-4 rounded-none hover:bg-primary-fixed transition-colors duration-300 flex items-center justify-center gap-2 group" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<footer class="text-center mt-2 border-t border-primary/10 pt-6">
<p class="font-body-md text-xs text-on-surface-variant/50 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">encrypted</span> Secure Connection
                </p>
</footer>
</div>
</main>
<script>
        // Simple label float effect for inputs
        document.querySelectorAll('.input-line').forEach(input => {
            // Initial check in case of autofill
            if(input.value !== '') {
                input.parentElement.previousElementSibling.classList.add('text-primary');
            }
            
            input.addEventListener('focus', (e) => {
                e.target.parentElement.previousElementSibling.classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', (e) => {
                if(e.target.value === '') {
                    e.target.parentElement.previousElementSibling.classList.replace('text-primary', 'text-on-surface-variant');
                }
            });
        });
    </script>
</body></html>
