<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Entrance Animations
            setTimeout(() => {
                document.getElementById('brand-section')?.classList.add('fade-enter-active');
                document.getElementById('auth-panel')?.classList.add('fade-enter-active');
            }, 100);

            // View Toggling Logic
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const viewLogin = document.getElementById('view-login');
            const viewRegister = document.getElementById('view-register');

            const activeBtnClasses = ['text-primary', 'border-primary'];
            const inactiveBtnClasses = ['text-on-surface-variant', 'border-transparent'];

            function switchView(viewToShow) {
                if(viewToShow === 'login') {
                    // Hide Register
                    viewRegister.classList.remove('opacity-100');
                    viewRegister.classList.add('opacity-0');
                    setTimeout(() => {
                        viewRegister.classList.add('hidden');
                        viewRegister.classList.remove('block');
                        
                        // Show Login
                        viewLogin.classList.remove('hidden');
                        viewLogin.classList.add('block');
                        // Small delay to allow display:block to apply before animating opacity
                        setTimeout(() => {
                            viewLogin.classList.remove('opacity-0');
                            viewLogin.classList.add('opacity-100');
                        }, 50);
                    }, 300); // Wait for fade out

                    // Update Buttons
                    btnLogin.classList.add(...activeBtnClasses);
                    btnLogin.classList.remove(...inactiveBtnClasses);
                    btnRegister.classList.remove(...activeBtnClasses);
                    btnRegister.classList.add(...inactiveBtnClasses);

                } else {
                    // Hide Login
                    viewLogin.classList.remove('opacity-100');
                    viewLogin.classList.add('opacity-0');
                    setTimeout(() => {
                        viewLogin.classList.add('hidden');
                        viewLogin.classList.remove('block');
                        
                        // Show Register
                        viewRegister.classList.remove('hidden');
                        viewRegister.classList.add('block');
                        setTimeout(() => {
                            viewRegister.classList.remove('opacity-0');
                            viewRegister.classList.add('opacity-100');
                        }, 50);
                    }, 300);

                    // Update Buttons
                    btnRegister.classList.add(...activeBtnClasses);
                    btnRegister.classList.remove(...inactiveBtnClasses);
                    btnLogin.classList.remove(...activeBtnClasses);
                    btnLogin.classList.add(...inactiveBtnClasses);
                }
            }

            btnLogin.addEventListener('click', () => switchView('login'));
            btnRegister.addEventListener('click', () => switchView('register'));
        });
    </script>
